<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diagram PDF Portal</title>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #0a1a33; /* deep navy */
      color: #e6f0ff;      /* soft light blue */
    }

    .header {
      text-align: center;
      padding: 2.5rem 1rem;
      background: #11264d;
      border-bottom: 6px solid #00a3e0;
    }

    .header h1 {
      margin: 0;
      font-size: 2.4rem;
      color: #00a3e0;
    }

    .header p {
      margin-top: 1rem;
      font-size: 1.2rem;
      color: #d0e0ff;
    }

    .grid {
      display: flex;
      justify-content: center;
      gap: 2rem;
      padding: 3rem 1rem;
      flex-wrap: wrap;
    }

    .pdf-tile {
      width: 150px;
      height: 150px;
      background: #11264d;
      border: 5px solid #00a3e0;
      border-radius: 0.6rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: bold;
      color: #e6f0ff;
      text-decoration: none;
      transition: 0.25s;
    }

    .pdf-tile:hover {
      background: #00a3e0;
      color: #0a1a33;
      transform: scale(1.07);
    }

    .footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.95rem;
      color: #b8c7e0;
      border-top: 4px solid #11264d;
      margin-top: 2rem;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Diagram PDF Portal</h1>
    <p>Access the operational diagram PDFs for roster viewing and calendar integration.</p>
  </div>

  <div class="grid">
    <a class="pdf-tile" href="pdfs/SO.pdf">SO</a>
    <a class="pdf-tile" href="pdfs/SU.pdf">SU</a>
    <a class="pdf-tile" href="pdfs/SX.pdf">SX</a>
  </div>

  <div class="footer">
    Designed & Maintained by Antony Jameson — Roster Project
  </div>

</body>
</html>
