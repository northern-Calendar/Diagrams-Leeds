<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagram PDF Portal</title>

<style>
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #0a1a33;
    color: #e6f0ff;
  }

  .header {
    text-align: center;
    padding: 2.5rem 1rem;
    background: #11264d;
    border-bottom: 6px solid #00a3e0;
  }

  .header h1 {
    margin: 0;
    font-size: 2.4rem;
    color: #00a3e0;
  }

  .header p {
    margin-top: 1rem;
    font-size: 1.2rem;
    color: #d0e0ff;
  }

  .grid {
    display: flex;
    justify-content: center;
    gap: 2rem;
    padding: 3rem 1rem;
    flex-wrap: wrap;
  }

  .pdf-tile {
    width: 150px;
    height: 190px;
    background: #11264d;
    border: 5px solid #00a3e0;
    border-radius: 0.6rem;
    text-decoration: none;
    color: #e6f0ff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: 0.25s;
  }

  .pdf-tile:hover {
    background: #00a3e0;
    color: #0a1a33;
    transform: scale(1.07);
  }

  .pdf-icon {
    width: 60px;
    height: 75px;
    background: #e6f0ff;
    border-radius: 4px;
    margin-bottom: 0.8rem;
    position: relative;
  }

  .pdf-icon::after {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    width: 22px;
    height: 22px;
    background: #00a3e0;
    border-bottom-left-radius: 4px;
  }

  .footer {
    text-align: center;
    padding: 1.5rem;
    font-size: 0.95rem;
    color: #b8c7e0;
    border-top: 4px solid #11264d;
    margin-top: 2rem;
  }
</style>
</head>

<body>

<div class="header">
  <h1>Diagram PDF Portal</h1>
  <p>A dedicated PDF portal for viewing roster diagrams.</p>
</div>

<div class="grid">
  <a class="pdf-tile" href="views/viewer.html?file=LD%20CONS%20SO.pdf">
    <div class="pdf-icon"></div>
    SO
  </a>

  <a class="pdf-tile" href="views/viewer.html?file=LD%20CONS%20SU.pdf">
    <div class="pdf-icon"></div>
    SU
  </a>

  <a class="pdf-tile" href="views/viewer.html?file=LD%20CONS%20SX.pdf">
    <div class="pdf-icon"></div>
    SX
  </a>
</div>

<div class="footer">
  Designed & Maintained by Antony Jameson — Roster Project
</div>

</body>
</html>
